<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자리 배치</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e2e5ea;--accent:#3b6df0;--accent-t:#fff;--fixed:#fff4d6;--fixed-line:#e8b931;--seat:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--text:#e8eaee;--muted:#9aa1ad;--line:#2f353f;--accent:#6c93ff;--accent-t:#0c1020;--fixed:#3a3217;--fixed-line:#c9a227;--seat:#252c3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
header{padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0 8px 0 0}
main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px 20px;max-width:1400px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}
textarea,input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:150px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button.danger{color:#d33}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 label{font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:12.5px}
#board{overflow-x:auto}
.podium{margin:0 auto 14px;width:160px;text-align:center;padding:6px;border-radius:8px;background:var(--line);font-size:13px;color:var(--muted)}
.room{display:flex;gap:28px;justify-content:center;min-width:max-content}
.group{display:grid;gap:8px}
.pair{display:flex;gap:2px}
.seat{width:76px;height:52px;border:1px solid var(--line);background:var(--seat);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:14px;cursor:pointer;position:relative;padding:2px;word-break:keep-all}
.seat.empty{background:transparent;border-style:dashed;color:var(--muted);font-weight:400}
.seat.fixed{background:var(--fixed);border-color:var(--fixed-line)}
.seat.fixed::after{content:"📌";position:absolute;top:-6px;right:-3px;font-size:11px}
.seat.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.7);opacity:.2}100%{transform:none;opacity:1}}
.hist{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.hist span{flex:1;font-size:13px}
.hist button{padding:3px 8px;font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:18px;width:300px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.warn{color:#d33;font-size:13px;margin-top:6px}
@media print{header,aside,.noprint{display:none!important}main{display:block;padding:0}.card{border:0}.seat{border-color:#888;background:#fff}.seat.fixed::after{display:none}}
</style>
</head>
<body>
<header>
  <h1>🪑 자리 배치</h1>
  <select id="classSel" style="width:auto;min-width:130px"></select>
  <button id="addClass">+ 반 추가</button>
  <button id="renameClass">이름 변경</button>
  <button id="delClass" class="danger">반 삭제</button>
  <span style="flex:1"></span>
  <button id="exportBtn">백업 저장</button>
  <button id="importBtn">백업 불러오기</button>
  <input type="file" id="importFile" accept=".json" hidden>
</header>
<main>
  <aside>
    <div class="card">
      <h2>학생 명단 (한 줄에 한 명)</h2>
      <textarea id="names" placeholder="엑셀에서 이름 열을 복사해 붙여넣으세요"></textarea>
      <div class="muted" id="count" style="margin-top:6px"></div>
    </div>
    <div class="card">
      <h2>교실 구조</h2>
      <div class="grid3">
        <div><label>분단 수</label><input type="number" id="cols" min="1" max="8"></div>
        <div><label>한 분단 인원</label><input type="number" id="per" min="1" max="4"></div>
        <div><label>줄 수</label><input type="number" id="rows" min="1" max="12"></div>
      </div>
      <div class="muted" id="seatInfo" style="margin-top:6px"></div>
    </div>
    <div class="card">
      <h2>저장된 배치 기록</h2>
      <div id="hist"></div>
      <div class="muted" id="histEmpty">아직 기록이 없습니다.</div>
    </div>
  </aside>
  <section>
    <div class="card">
      <div class="row noprint" style="margin-bottom:12px">
        <button id="shuffle" class="primary">🎲 랜덤 배치</button>
        <button id="clearFix">고정석 모두 해제</button>
        <button id="save">기록에 저장</button>
        <button onclick="window.print()">인쇄</button>
        <label class="muted"><input type="checkbox" id="flip" style="width:auto"> 학생 시점으로 뒤집기</label>
      </div>
      <div class="warn" id="warn"></div>
      <div id="board"></div>
      <div class="muted noprint" style="margin-top:10px">자리를 클릭하면 📌 고정석을 지정/해제할 수 있어요. 고정된 학생은 랜덤 배치에서도 그 자리에 남습니다.</div>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog">
    <div id="dlgTitle" style="font-weight:600;margin-bottom:10px"></div>
    <select id="dlgSel" size="8" style="padding:4px"></select>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button value="unfix" id="dlgUnfix">고정 해제</button>
      <button value="cancel">취소</button>
      <button value="ok" class="primary">고정</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'seatApp.v1';
const $ = id => document.getElementById(id);
let db;

function newClass(){ return {students:[], cols:3, per:2, rows:5, fixed:{}, seats:[], history:[]}; }
function load(){
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if(!db || !db.classes || !Object.keys(db.classes).length){ db = {current:'1반', classes:{'1반':newClass()}}; }
  if(!db.classes[db.current]) db.current = Object.keys(db.classes)[0];
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
const cur = () => db.classes[db.current];
const total = c => c.cols*c.per*c.rows;

function renderClassSel(){
  $('classSel').innerHTML = Object.keys(db.classes).map(n=>`<option ${n===db.current?'selected':''}>${esc(n)}</option>`).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderAll(pop){
  const c = cur();
  renderClassSel();
  if(document.activeElement!==$('names')) $('names').value = c.students.join('\n');
  $('cols').value=c.cols; $('per').value=c.per; $('rows').value=c.rows;
  $('count').textContent = `학생 ${c.students.length}명`;
  $('seatInfo').textContent = `총 ${total(c)}석 (${c.cols}분단 × ${c.per}명 × ${c.rows}줄)`;
  const over = c.students.length > total(c);
  $('warn').textContent = over ? `⚠ 자리(${total(c)})가 학생 수(${c.students.length})보다 적어요.` : '';
  renderBoard(pop); renderHist();
}

function renderBoard(pop){
  const c = cur(), flip = $('flip').checked;
  const perRow = c.cols*c.per;
  let html = '<div class="podium">교탁 / 칠판</div><div class="room">';
  const colOrder = [...Array(c.cols).keys()], rowOrder = [...Array(c.rows).keys()];
  if(flip){ colOrder.reverse(); rowOrder.reverse(); }
  if(flip) html = '<div class="room">';
  for(const g of colOrder){
    html += '<div class="group">';
    for(const r of rowOrder){
      html += '<div class="pair">';
      const ks = [...Array(c.per).keys()]; if(flip) ks.reverse();
      for(const k of ks){
        const idx = r*perRow + g*c.per + k;
        const name = c.seats[idx] || '';
        const fx = c.fixed[idx] !== undefined;
        html += `<div class="seat ${name?'':'empty'} ${fx?'fixed':''} ${pop&&name?'pop':''}" data-i="${idx}" style="${pop?`animation-delay:${(idx%perRow)*25+r*40}ms`:''}">${name?esc(name):idx+1}</div>`;
      }
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  if(flip) html += '<div class="podium" style="margin:14px auto 0">교탁 / 칠판</div>';
  $('board').innerHTML = html;
}

function renderHist(){
  const h = cur().history;
  $('histEmpty').style.display = h.length?'none':'';
  $('hist').innerHTML = h.map((x,i)=>`<div class="hist"><span>${esc(x.label)}</span><button data-load="${i}">보기</button><button data-del="${i}" class="danger">삭제</button></div>`).join('');
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function doShuffle(){
  const c = cur(), n = total(c);
  const seats = Array(n).fill('');
  const placed = new Set();
  for(const [i,name] of Object.entries(c.fixed)){
    if(+i<n && c.students.includes(name) && !placed.has(name)){ seats[+i]=name; placed.add(name); }
  }
  const rest = shuffle(c.students.filter(s=>!placed.has(s)));
  const free = shuffle([...Array(n).keys()].filter(i=>!seats[i]));
  rest.forEach((s,k)=>{ if(k<free.length) seats[free[k]]=s; });
  c.seats = seats; persist(); renderAll(true);
}

// ---- events
$('names').addEventListener('input', e=>{
  const c = cur();
  c.students = [...new Set(e.target.value.split('\n').map(s=>s.trim()).filter(Boolean))];
  for(const i of Object.keys(c.fixed)) if(!c.students.includes(c.fixed[i])) delete c.fixed[i];
  c.seats = c.seats.map(s=>c.students.includes(s)?s:'');
  persist(); renderAll();
});
['cols','per','rows'].forEach(id=>$(id).addEventListener('change', e=>{
  const c = cur(), lim={cols:[1,8],per:[1,4],rows:[1,12]}[id];
  c[id] = Math.min(lim[1], Math.max(lim[0], parseInt(e.target.value)||lim[0]));
  c.fixed = {}; c.seats = []; persist(); renderAll();
}));
$('shuffle').onclick = doShuffle;
$('flip').onchange = ()=>renderBoard();
$('clearFix').onclick = ()=>{ cur().fixed={}; persist(); renderAll(); };
$('save').onclick = ()=>{
  const c = cur(); if(!c.seats.some(Boolean)) return alert('먼저 배치를 만들어 주세요.');
  const d = new Date(), p=n=>String(n).padStart(2,'0');
  const def = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  const label = prompt('기록 이름', def); if(label===null) return;
  c.history.unshift({label:label||def, seats:[...c.seats], fixed:{...c.fixed}, cols:c.cols, per:c.per, rows:c.rows});
  persist(); renderHist();
};
$('hist').addEventListener('click', e=>{
  const c = cur(), t = e.target;
  if(t.dataset.load!==undefined){
    const h = c.history[+t.dataset.load];
    Object.assign(c,{seats:[...h.seats],fixed:{...h.fixed},cols:h.cols,per:h.per,rows:h.rows});
    persist(); renderAll();
  } else if(t.dataset.del!==undefined){
    if(confirm('이 기록을 삭제할까요?')){ c.history.splice(+t.dataset.del,1); persist(); renderHist(); }
  }
});

// seat click -> fixed dialog
let dlgSeat = null;
$('board').addEventListener('click', e=>{
  const s = e.target.closest('.seat'); if(!s) return;
  const c = cur(); dlgSeat = +s.dataset.i;
  const fixedHere = c.fixed[dlgSeat];
  $('dlgTitle').textContent = `${dlgSeat+1}번 자리 고정석 지정`;
  const taken = new Set(Object.entries(c.fixed).filter(([i])=>+i!==dlgSeat).map(([,n])=>n));
  const pick = fixedHere || c.seats[dlgSeat];
  $('dlgSel').innerHTML = c.students.filter(n=>!taken.has(n)).map(n=>`<option ${n===pick?'selected':''}>${esc(n)}</option>`).join('');
  $('dlgUnfix').style.display = fixedHere!==undefined ? '' : 'none';
  $('dlg').showModal();
});
$('dlg').addEventListener('close', ()=>{
  const c = cur(), v = $('dlg').returnValue;
  if(v==='ok' && $('dlgSel').value){
    const name = $('dlgSel').value;
    for(const i of Object.keys(c.fixed)) if(c.fixed[i]===name) delete c.fixed[i];
    // move the student into this seat now (swap with whoever sits here)
    const from = c.seats.indexOf(name);
    if(from>=0) c.seats[from] = c.seats[dlgSeat] || '';
    c.seats[dlgSeat] = name; c.fixed[dlgSeat] = name;
  } else if(v==='unfix'){ delete c.fixed[dlgSeat]; }
  else return;
  persist(); renderAll();
});

// classes
$('classSel').onchange = e=>{ db.current=e.target.value; persist(); renderAll(); };
$('addClass').onclick = ()=>{
  const n = (prompt('새 반 이름', `${Object.keys(db.classes).length+1}반`)||'').trim();
  if(!n) return; if(db.classes[n]) return alert('이미 있는 이름이에요.');
  db.classes[n]=newClass(); db.current=n; persist(); renderAll();
};
$('renameClass').onclick = ()=>{
  const n = (prompt('반 이름 변경', db.current)||'').trim();
  if(!n || n===db.current) return; if(db.classes[n]) return alert('이미 있는 이름이에요.');
  db.classes = Object.fromEntries(Object.entries(db.classes).map(([k,v])=>[k===db.current?n:k,v]));
  db.current=n; persist(); renderAll();
};
$('delClass').onclick = ()=>{
  if(Object.keys(db.classes).length<2) return alert('마지막 반은 삭제할 수 없어요.');
  if(!confirm(`'${db.current}'을(를) 삭제할까요? 명단과 기록이 모두 사라집니다.`)) return;
  delete db.classes[db.current]; db.current=Object.keys(db.classes)[0]; persist(); renderAll();
};

// backup
$('exportBtn').onclick = ()=>{
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
  a.download = 'seat-backup.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = ()=>$('importFile').click();
$('importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d.classes || !Object.keys(d.classes).length) throw 0;
      if(!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?')) return;
      db = d; if(!db.classes[db.current]) db.current=Object.keys(db.classes)[0];
      persist(); renderAll();
    }catch(_){ alert('올바른 백업 파일이 아니에요.'); }
  };
  r.readAsText(f); e.target.value='';
};

load(); renderAll();
</script>
</body>
</html>
